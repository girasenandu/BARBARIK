m()">CANCEL</button></div></div></section><section class="section"><h3>Voice / Command</h3><div class="card"><div class="label">उदा. “Ramesh कडून 10000 रुपये घ्यायचे आहेत”</div><div class="actions" style="margin-top:9px"><button class="btn primary" onclick="startVoice()">🎙️ बोल</button><button class="btn ghost" onclick="speakSummary()">🔊 BARBARIK सांग</button></div><div id="voiceText" class="meta" style="margin-top:9px"></div></div></section><section class="section"><h3>Follow-up</h3><div class="tabs"><button id="tDue" class="tab active" onclick="showList('due')">आज / जवळचे Due</button><button id="tAll" class="tab" onclick="showList('all')">सर्व Entries</button></div><div class="search"><input id="search" placeholder="नाव search करा..." oninput="render()"></div><div id="list" class="list" style="margin-top:9px"></div></section><div class="footer">BARBARIK • Rajput Solar • Local-first MVP • Data stays on this device</div></main><script>const KEY='barbarik_transactions_v1';let tx=JSON.parse(localStorage.getItem(KEY)||'[]'),mode='due';const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});function save(){localStorage.setItem(KEY,JSON.stringify(tx))}function openForm(type){document.getElementById('form').classList.add('open');document.getElementById('type').value=type;document.getElementById('name').focus()}function closeForm(){document.getElementById('form').classList.remove('open')}function saveTx(){const name=document.getElementById('name').value.trim(),amount=Number(document.getElementById('amount').value);if(!name||!amount){alert('नाव आणि रक्कम भरा');return}tx.unshift({id:crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random(),name,amount,type:document.getElementById('type').value,due:document.getElementById('due').value,note:document.getElementById('note').value.trim(),created:new Date().toISOString()});save();['name','amount','due','note'].forEach(id=>document.getElementById(id).value='');closeForm();render()}function totals(){let r=0,p=0;tx.forEach(x=>{if(x.type==='RECEIVABLE')r+=x.amount;if(x.type==='PAYABLE')p+=x.amount;if(x.type==='RECEIVED')r-=x.amount;if(x.type==='PAID')p-=x.amount});return{r,p,net:r-p}}function render(){const t=totals();recv.textContent=money(t.r);pay.textContent=money(t.p);net.textContent=money(t.net);count.textContent=tx.length;const q=search.value.toLowerCase();const now=new Date();now.setHours(23,59,59,999);let arr=tx.filter(x=>!q||x.name.toLowerCase().includes(q));if(mode==='due')arr=arr.filter(x=>x.due&&new Date(x.due+'T23:59:59')<=new Date(now.getTime()+7*86400000));if(!arr.length){list.innerHTML='<div class="empty">काही entry नाही.</div>';return}list.innerHTML=arr.map(x=>{const positive=['RECEIVABLE','RECEIVED'].includes(x.type),label={RECEIVABLE:'घ्यायचे',PAYABLE:'द्यायचे',RECEIVED:'मिळाले',PAID:'दिले'}[x.type],due=x.due?new Date(x.due+'T12:00:00').toLocaleDateString('en-IN'):'';return `<div class="item"><div><strong>${esc(x.name)}</strong><div class="meta">${label}${due?' • Due '+due:''}${x.note?' • '+esc(x.note):''}</div></div><div style="text-align:right"><strong class="${positive?'green':'red'}">${money(x.amount)}</strong>${x.type==='RECEIVABLE'?`<br><button class="mini call" onclick="callPerson('${escAttr(x.name)}')">📞 Call</button>`:''}</div></div>`}).join('')}function showList(m){mode=m;tDue.classList.toggle('active',m==='due');tAll.classList.toggle('active',m==='all');render()}function callPerson(name){alert(name+' ला call करण्यासाठी पुढील version मध्ये phone number जोडू.')}function speak(text){if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(text))}}function speakSummary(){const t=totals();speak(`BARBARIK. घ्यायचे बाकी ${t.r} रुपये. द्यायचे बाकी ${t.p} रुपये. Net position ${t.net} रुपये.`)}function startVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('या browser मध्ये voice recognition उपलब्ध नाही.');return}const r=new SR;r.lang='mr-IN';r.interimResults=false;r.onresult=e=>{const text=e.results[0][0].transcript;voiceText.textContent='ऐकलं: '+text;parseVoice(text)};r.onerror=()=>alert('Voice पुन्हा try करा.');r.start()}function parseVoice(s){const lower=s.toLowerCase(),nums=s.replace(/,/g,'').match(/\d+(?:\.\d+)?/g);if(!nums){openForm('RECEIVABLE');return}let amount=Number(nums[nums.length-1]);if(lower.includes('lakh')||lower.includes('लाख'))amount*=100000;else if(lower.includes('thousand')||lower.includes('हजार'))amount*=1000;else if(lower.includes('crore'))amount*=10000000;let type=(lower.includes('दिले')||lower.includes('paid')||lower.includes('देतो'))?'PAID':(lower.includes('मिळाले')||lower.includes('received')||lower.includes('आले'))?'RECEIVED':(lower.includes('द्यायचे')||lower.includes('देणे')||lower.includes('payable'))?'PAYABLE':'RECEIVABLE';amount&& (document.getElementById('amount').value=amount);document.getElementById('type').value=type;document.getElementById('name').value=s.replace(/\d+(?:\.\d+)?/,'').replace(/lakh|लाख|हजार|thousand|crore|रुपये|rupees/gi,'').trim().split(/कडून|ला|from|to/i)[0].trim();document.getElementById('form').classList.add('open')}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(s){return s.replace(/'/g,"\\'")}if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));render();</script></body></html>
