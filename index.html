<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>BARBARIK - Rajput Solar</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07111f;color:#eef5ff}.app{max-width:720px;margin:auto;min-height:100vh;padding:14px 14px 45px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-size:25px;font-weight:900;letter-spacing:1px}.sub{color:#8ea1b8;font-size:12px;margin-top:2px}.core{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#ffd65a 0 12%,#ff8a00 28%,#192b43 65%);box-shadow:0 0 24px #ff9d0038;font-size:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#0d1b2d;border:1px solid #1c314a;border-radius:18px;padding:14px;box-shadow:0 8px 30px #0003}.big{font-size:23px;font-weight:800;margin-top:6px}.label{color:#91a5bd;font-size:12px}.green{color:#55d88a}.red{color:#ff7373}.yellow{color:#ffd35a}.section{margin-top:15px}.section h3{margin:0 0 9px;font-size:16px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{padding:13px;border-radius:13px;font-weight:800}.receive{background:#123c2a;color:#72eca0}.pay{background:#45202a;color:#ff9aa5}.primary{background:#ffb300;color:#17100a}.ghost{background:#14263b;color:#dce8f6}.form{display:none;margin-top:10px}.form.open{display:block}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin-bottom:9px}.field label{display:block;color:#8ea1b8;font-size:11px;margin-bottom:5px}.field input,.field select{width:100%;background:#091524;border:1px solid #29415e;color:#fff;border-radius:11px;padding:12px;outline:none}.field input:focus,.field select:focus{border-color:#ffb300}.list{display:flex;flex-direction:column;gap:8px}.item{background:#0b1726;border:1px solid #1a2d43;border-radius:14px;padding:12px}.itemTop{display:flex;justify-content:space-between;gap:10px}.item strong{display:block}.meta{font-size:11px;color:#8095ad;margin-top:4px}.empty{padding:18px;text-align:center;color:#71869d;border:1px dashed #263b54;border-radius:14px}.search input{width:100%;background:#0d1b2d;border:1px solid #1c314a;color:white;border-radius:13px;padding:12px}.tabs{display:flex;gap:7px;margin:14px 0 8px;overflow:auto}.tab{white-space:nowrap;padding:9px 12px;border-radius:10px;background:#0d1b2d;color:#8fa3ba}.tab.active{background:#ffb300;color:#17100a;font-weight:700}.person{background:#0d1b2d;border:1px solid #1c314a;border-radius:15px;padding:12px}.personHead{display:flex;justify-content:space-between;align-items:center}.personName{font-weight:800}.badge{font-size:11px;padding:5px 8px;border-radius:8px}.badge.rec{background:#123c2a;color:#72eca0}.badge.pay{background:#45202a;color:#ff9aa5}.personBtns{display:flex;gap:7px;margin-top:9px}.personBtns button{flex:1}.small{padding:9px;border-radius:9px;background:#182c44;color:#dce8f6}.call{background:#163d31;color:#74e6a5}.footer{margin-top:22px;text-align:center;color:#536b84;font-size:11px}</style></head><body><main class="app"><header class="top"><div><div class="brand">BARBARIK</div><div class="sub">Rajput Solar • Money & Cash Flow Assistant</div></div><div class="core">⚡</div></header><section class="grid"><div class="card"><div class="label">घ्यायचे बाकी</div><div id="recTotal" class="big green">₹0</div></div><div class="card"><div class="label">द्यायचे बाकी</div><div id="payTotal" class="big red">₹0</div></div><div class="card"><div class="label">Net Position</div><div id="netTotal" class="big yellow">₹0</div></div><div class="card"><div class="label">Open Entries</div><div id="openTotal" class="big">0</div></div></section><section class="section"><h3>Quick Entry</h3><div class="actions"><button class="btn receive" onclick="openForm('RECEIVABLE')">+ पैसे घ्यायचे</button><button class="btn pay" onclick="openForm('PAYABLE')">− पैसे द्यायचे</button></div><div id="form" class="form"><div class="row"><div class="field"><label>Person Name</label><input id="name" placeholder="उदा. Ramesh"></div><div class="field"><label>Mobile (optional)</label><input id="mobile" inputmode="tel" placeholder="98xxxxxxxx"></div><div class="field"><label>Amount ₹</label><input id="amount" inputmode="decimal" placeholder="10000"></div><div class="field"><label>Type</label><select id="type"><option value="RECEIVABLE">घ्यायचे बाकी</option><option value="PAYABLE">द्यायचे बाकी</option><option value="RECEIVED">पैसे मिळाले</option><option value="PAID">पैसे दिले</option></select></div><div class="field"><label>Due Date</label><input id="due" type="date"></div><div class="field"><label>Note</label><input id="note" placeholder="काम / बिल / payment"></div></div><div class="actions"><button class="btn ghost" onclick="closeForm()">Cancel</button><button class="btn primary" onclick="saveTx()">Save Transaction</button></div></div></section><section class="section"><h3>Voice / Command</h3><div class="actions"><button class="btn primary" onclick="startVoice()">🎙️ बोला</button><button class="btn ghost" onclick="speakSummary()">🔊 Summary</button></div><div id="voiceStatus" class="meta">उदा. “Ramesh कडून 10 हजार रुपये घ्यायचे आहेत”</div></section><section class="section"><h3>Person-wise Ledger</h3><div class="search"><input id="personSearch" oninput="renderPeople()" placeholder="Person search..."></div><div id="people" class="list" style="margin-top:9px"></div></section><section class="section"><h3>Follow-up</h3><div class="tabs"><button id="dueTab" class="tab active" onclick="setTab('due')">Due / Pending</button><button id="allTab" class="tab" onclick="setTab('all')">All</button></div><div id="transactions" class="list"></div></section><footer class="footer">BARBARIK • Rajput Solar • Local-first MVP</footer></main><script>const KEY='barbarik_transactions_v3';let tx=JSON.parse(localStorage.getItem(KEY)||'[]'),tab='due';const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});function persist(){localStorage.setItem(KEY,JSON.stringify(tx));render()}function openForm(t){document.getElementById('form').classList.add('open');document.getElementById('type').value=t;document.getElementById('name').focus()}function closeForm(){document.getElementById('form').classList.remove('open')}function saveTx(){const name=document.getElementById('name').value.trim(),amount=Number(document.getElementById('amount').value);if(!name||!amount){alert('Person आणि Amount भरा');return}tx.push({id:Date.now(),name,mobile:document.getElementById('mobile').value.trim(),amount,type:document.getElementById('type').value,due:document.getElementById('due').value,note:document.getElementById('note').value.trim(),created:new Date().toISOString()});persist();['name','mobile','amount','due','note'].forEach(id=>document.getElementById(id).value='');closeForm()}function personData(){const m={};for(const x of tx){const k=x.name.toLowerCase();if(!m[k])m[k]={name:x.name,mobile:x.mobile||'',rec:0,pay:0,received:0,paid:0,items:[]};const p=m[k];if(x.mobile)p.mobile=x.mobile;if(x.type==='RECEIVABLE')p.rec+=x.amount;if(x.type==='RECEIVED')p.received+=x.amount;if(x.type==='PAYABLE')p.pay+=x.amount;if(x.type==='PAID')p.paid+=x.amount;p.items.push(x)}for(const p of Object.values(m)){p.rec=Math.max(0,p.rec-p.received);p.pay=Math.max(0,p.pay-p.paid)}return Object.values(m)}function render(){let rec=0,pay=0;for(const x of tx){if(x.type==='RECEIVABLE')rec+=x.amount;if(x.type==='RECEIVED')rec-=x.amount;if(x.type==='PAYABLE')pay+=x.amount;if(x.type==='PAID')pay-=x.amount}rec=Math.max(0,rec);pay=Math.max(0,pay);document.getElementById('recTotal').textContent=money(rec);document.getElementById('payTotal').textContent=money(pay);document.getElementById('netTotal').textContent=money(rec-pay);document.getElementById('openTotal').textContent=tx.filter(x=>x.type==='RECEIVABLE'||x.type==='PAYABLE').length;renderPeople();renderTx()}function renderPeople(){const q=(document.getElementById('personSearch').value||'').toLowerCase(),arr=personData().filter(p=>p.name.toLowerCase().includes(q)),el=document.getElementById('people');if(!arr.length){el.innerHTML='<div class="empty">अजून person ledger नाही</div>';return}el.innerHTML=arr.map(p=>{const label=p.rec?'घ्यायचे '+money(p.rec):p.pay?'द्यायचे '+money(p.pay):'हिशोब clear',cls=p.rec?'rec':p.pay?'pay':'';return '<div class="person"><div class="personHead"><div><div class="personName">'+esc(p.name)+'</div><div class="meta">'+(p.mobile?esc(p.mobile):'Mobile नाही')+' • '+p.items.length+' entries</div></div><span class="badge '+cls+'">'+label+'</span></div><div class="personBtns"><button class="small" onclick="viewPerson('+JSON.stringify(p.name).replaceAll('"','&quot;')+')">Ledger</button>'+(p.mobile?'<button class="small call" onclick="location.href=\'tel:'+escAttr(p.mobile)+'\'">Call</button>':'')+'</div></div>'}).join('')}function viewPerson(name){document.getElementById('personSearch').value=name;renderPeople();document.getElementById('transactions').scrollIntoView({behavior:'smooth'})}function renderTx(){const today=new Date().toISOString().slice(0,10);let arr=tx.slice().reverse();if(tab==='due')arr=arr.filter(x=>(x.type==='RECEIVABLE'||x.type==='PAYABLE')&&(!x.due||x.due<=today));const el=document.getElementById('transactions');if(!arr.length){el.innerHTML='<div class="empty">No pending entries 🎯</div>';return}el.innerHTML=arr.map(x=>{const isIn=x.type==='RECEIVABLE'||x.type==='RECEIVED',typeLabel={RECEIVABLE:'घ्यायचे',PAYABLE:'द्यायचे',RECEIVED:'मिळाले',PAID:'दिले'}[x.type];return '<div class="item"><div><strong>'+esc(x.name)+' • '+money(x.amount)+'</strong><div class="meta">'+typeLabel+(x.due?' • Due: '+x.due:'')+(x.note?' • '+esc(x.note):'')+'</div></div><span class="badge '+(isIn?'rec':'pay')+'">'+(isIn?'IN':'OUT')+'</span></div>'}).join('')}function setTab(t){tab=t;document.getElementById('dueTab').classList.toggle('active',t==='due');document.getElementById('allTab').classList.toggle('active',t==='all');renderTx()}function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]||c))}function escAttr(s){return String(s||'').replace(/[^0-9+]/g,'')}function speakSummary(){const p=personData(),rec=p.reduce((a,x)=>a+x.rec,0),pay=p.reduce((a,x)=>a+x.pay,0),text='Rajput Solar. घ्यायचे बाकी '+money(rec)+'. द्यायचे बाकी '+money(pay)+'. Net position '+money(rec-pay)+'. Pending people '+p.filter(x=>x.rec||x.pay).length+'.';if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(text))}}function startVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById('voiceStatus').textContent='या browser मध्ये Voice Recognition उपलब्ध नाही.';return}const r=new SR();r.lang='mr-IN';r.interimResults=false;r.maxAlternatives=1;document.getElementById('voiceStatus').textContent='ऐकतोय... बोला';r.onresult=e=>{const s=e.results[0][0].transcript;document.getElementById('voiceStatus').textContent='ऐकले: '+s;parseVoice(s)};r.onerror=()=>document.getElementById('voiceStatus').textContent='Voice पुन्हा try करा';r.start()}function parseVoice(s){let amount=0,l=s.toLowerCase().replace(/,/g,'');const m=l.match(/(\d+(?:\.\d+)?)\s*(k|हजार|हजारा|lakh|लाख)?/);if(m)amount=Number(m[1])*(m[2]==='k'||m[2]==='हजार'||m[2]==='हजारा'?1000:m[2]==='lakh'||m[2]==='लाख'?100000:1);let type=/घ्यायचे|येणे|यायचे|घेणे|येणार/.test(s)?'RECEIVABLE':/द्यायचे|देणे|देणार/.test(s)?'PAYABLE':/मिळाले|घेतले|आले/.test(s)?'RECEIVED':/दिले|दिलेत|payment केला|paid/.test(l)?'PAID':'RECEIVABLE';let clean=s.replace(/घ्यायचे|द्यायचे|आहेत|आहे|रुपये|रुपय|रु|पैसे|मिळाले|घेतले|आले|दिले|दिलेत|payment केला|paid/gi,'').replace(/\d+(?:\.\d+)?\s*(k|हजार|हजारा|lakh|लाख)?/gi,'').trim();openForm(type);document.getElementById('name').value=clean;document.getElementById('amount').value=amount||''}render();</script></body></html>
