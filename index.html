<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json"><title>BARBARIK</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07111f;color:#eef5ff}button,input,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:720px;margin:auto;min-height:100vh;padding:18px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-size:26px;font-weight:800;letter-spacing:1px}.sub{color:#8ea1b8;font-size:12px}.core{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#ffd65a 0 12%,#ff8a00 28%,#192b43 65%);box-shadow:0 0 24px #ff9d0038;font-size:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#0d1b2d;border:1px solid #1c314a;border-radius:18px;padding:14px;box-shadow:0 8px 30px #0003}.big{font-size:25px;font-weight:800;margin-top:6px}.label{color:#91a5bd;font-size:12px}.green{color:#55d88a}.red{color:#ff7373}.yellow{color:#ffd35a}.section{margin-top:14px}.section h3{margin:0 0 9px;font-size:15px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{padding:14px;border-radius:14px;font-weight:700}.receive{background:#123c2a;color:#72eca0}.pay{background:#45202a;color:#ff9aa5}.primary{background:#ffb300;color:#17100a}.ghost{background:#14263b;color:#dce8f6}.form{display:none;margin-top:10px}.form.open{display:block}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin-bottom:9px}.field label{display:block;color:#8ea1b8;font-size:11px;margin-bottom:5px}.field input,.field select{width:100%;background:#091524;border:1px solid #29415e;color:#fff;border-radius:11px;padding:12px;outline:none}.field input:focus{border-color:#ffb300}.full{grid-column:1/-1}.list{display:flex;flex-direction:column;gap:8px}.item{background:#0b1726;border:1px solid #1a2d43;border-radius:14px;padding:12px;display:flex;justify-content:space-between;gap:10px}.item strong{display:block}.meta{font-size:11px;color:#8095ad;margin-top:3px}.empty{padding:18px;text-align:center;color:#71869d;border:1px dashed #263b54;border-radius:14px}.search{margin-top:10px}.search input{width:100%;background:#0d1b2d;border:1px solid #1c314a;color:white;border-radius:13px;padding:12px}.footer{margin-top:22px;text-align:center;color:#536b84;font-size:11px}.danger{color:#ff7e88}.mini{padding:7px 10px;border-radius:9px;background:#182c44;color:#dce8f6;font-size:11px}.call{background:#163d31;color:#74e6a5}.tabs{display:flex;gap:7px;margin:14px 0 8px;overflow:auto}.tab{white-space:nowrap;padding:9px 12px;border-radius:10px;background:#0d1b2d;color:#8fa3ba}.tab.active{background:#ffb300;color:#17100a;font-weight:700}
</style></head>
<body><main class="app">
<header class="top"><div><div class="brand">🏹 BARBARIK</div><div class="sub">Smart Money & Cash-Flow Assistant</div></div><div class="core">⚡</div></header>
<section class="grid"><div class="card"><div class="label">घ्यायचे बाकी</div><div id="recv" class="big green">₹0</div></div><div class="card"><div class="label">द्यायचे बाकी</div><div id="pay" class="big red">₹0</div></div><div class="card"><div class="label">Net Position</div><div id="net" class="big yellow">₹0</div></div><div class="card"><div class="label">Open Entries</div><div id="count" class="big">0</div></div></section>
<section class="section"><h3>Quick Entry</h3><div class="actions"><button class="btn receive" onclick="openForm('RECEIVABLE')">+ पैसे घ्यायचे</button><button class="btn pay" onclick="openForm('PAYABLE')">− पैसे द्यायचे</button></div>
<div id="form" class="card form"><div class="row"><div class="field"><label>नाव</label><input id="name" placeholder="उदा. Ramesh"></div><div class="field"><label>रक्कम ₹</label><input id="amount" inputmode="decimal" placeholder="10000"></div><div class="field"><label>Type</label><select id="type"><option value="RECEIVABLE">घ्यायचे</option><option value="PAYABLE">द्यायचे</option><option value="RECEIVED">मिळाले</option><option value="PAID">दिले</option></select></div><div class="field"><label>Due date</label><input id="due" type="date"></div><div class="field full"><label>Note</label><input id="note" placeholder="काम / payment / project"></div></div><div class="actions"><button class="btn primary" onclick="saveTx()">SAVE</button><button class="btn ghost" onclick="closeForm()">CANCEL</button></div></div></section>
<section class="section"><h3>Voice / Command</h3><div class="card"><div class="label">उदा. “Ramesh कडून 10000 रुपये घ्यायचे आहेत”</div><div class="actions" style="margin-top:9px"><button class="btn primary" onclick="startVoice()">🎙️ बोल</button><button class="btn ghost" onclick="speakSummary()">🔊 BARBARIK सांग</button></div><div id="voiceText" class="meta" style="margin-top:9px"></div></div></section>
<section class="section"><h3>Follow-up</h3><div class="tabs"><button id="tDue" class="tab active" onclick="showList('due')">आज / जवळचे Due</button><button id="tAll" class="tab" onclick="showList('all')">सर्व Entries</button></div><div class="search"><input id="search" placeholder="नाव search करा..." oninput="render()"></div><div id="list" class="list" style="margin-top:9px"></div></section>
<div class="footer">BARBARIK • Local-first MVP • Data stays on this device</div>
</main>
<script>
const KEY='barbarik_transactions_v1'; let tx=JSON.parse(localStorage.getItem(KEY)||'[]'); let mode='due';
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
function save(){localStorage.setItem(KEY,JSON.stringify(tx))}
function openForm(type){document.getElementById('form').classList.add('open');document.getElementById('type').value=type;document.getElementById('name').focus()}
function closeForm(){document.getElementById('form').classList.remove('open')}
function saveTx(){const name=document.getElementById('name').value.trim();const amount=Number(document.getElementById('amount').value);if(!name||!amount){alert('नाव आणि रक्कम भरा');return}tx.unshift({id:crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random(),name,amount,type:document.getElementById('type').value,due:document.getElementById('due').value,note:document.getElementById('note').value.trim(),created:new Date().toISOString()});save();['name','amount','due','note'].forEach(id=>document.getElementById(id).value='');closeForm();render()}
function totals(){let r=0,p=0;tx.forEach(x=>{if(x.type==='RECEIVABLE')r+=x.amount;if(x.type==='PAYABLE')p+=x.amount;if(x.type==='RECEIVED')r-=x.amount;if(x.type==='PAID')p-=x.amount});return{r,p,net:r-p}}
function render(){const t=totals();document.getElementById('recv').textContent=money(t.r);document.getElementById('pay').textContent=money(t.p);document.getElementById('net').textContent=money(t.net);document.getElementById('count').textContent=tx.length;const q=document.getElementById('search').value.toLowerCase();const now=new Date();now.setHours(23,59,59,999);let arr=tx.filter(x=>!q||x.name.toLowerCase().includes(q));if(mode==='due')arr=arr.filter(x=>x.due&&new Date(x.due+'T23:59:59')<=new Date(now.getTime()+7*86400000));const el=document.getElementById('list');if(!arr.length){el.innerHTML='<div class="empty">काही entry नाही.</div>';return}el.innerHTML=arr.map(x=>{const positive=['RECEIVABLE','RECEIVED'].includes(x.type);const label={RECEIVABLE:'घ्यायचे',PAYABLE:'द्यायचे',RECEIVED:'मिळाले',PAID:'दिले'}[x.type];const due=x.due?new Date(x.due+'T12:00:00').toLocaleDateString('en-IN'):'';return `<div class="item"><div><strong>${esc(x.name)}</strong><div class="meta">${label}${due?' • Due '+due:''}${x.note?' • '+esc(x.note):''}</div></div><div style="text-align:right"><strong class="${positive?'green':'red'}">${money(x.amount)}</strong>${x.type==='RECEIVABLE'?`<br><button class="mini call" onclick="callPerson('${escAttr(x.name)}')">📞 Call</button>`:''}</div></div>`}).join('')}
function showList(m){mode=m;document.getElementById('tDue').classList.toggle('active',m==='due');document.getElementById('tAll').classList.toggle('active',m==='all');render()}
function callPerson(name){window.location.href='tel:'; alert(name+' ला call करण्यासाठी phone number पुढील version मध्ये जोडू. आत्ता person contact field जोडायचा आहे.')}
function speak(text){if('speechSynthesis' in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(text))}}
function speakSummary(){const t=totals();speak(`BARBARIK. घ्यायचे बाकी ${t.r} रुपये. द्यायचे बाकी ${t.p} रुपये. Net position ${t.net} रुपये.`)}
function startVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('या browser मध्ये voice recognition उपलब्ध नाही.');return}const r=new SR();r.lang='mr-IN';r.interimResults=false;r.onresult=e=>{const text=e.results[0][0].transcript;document.getElementById('voiceText').textContent='ऐकलं: '+text;parseVoice(text)};r.onerror=()=>alert('Voice पुन्हा try करा.');r.start()}
function parseVoice(s){const lower=s.toLowerCase();const nums=s.replace(/,/g,'').match(/\d+(?:\.\d+)?/g);if(!nums){openForm('RECEIVABLE');return}let amount=Number(nums[nums.length-1]);if(lower.includes('lakh'))amount*=100000;else if(lower.includes('thousand')||lower.includes('हजार'))amount*=1000;else if(lower.includes('crore'))amount*=10000000;let type=(lower.includes('दिले')||lower.includes('paid')||lower.includes('देतो'))?'PAID':(lower.includes('मिळाले')||lower.includes('received')||lower.includes('आले'))?'RECEIVED':(lower.includes('द्यायचे')||lower.includes('देणे')||lower.includes('payable'))?'PAYABLE':'RECEIVABLE';document.getElementById('amount').value=amount;document.getElementById('type').value=type;const cleaned=s.replace(/\d+(?:\.\d+)?/,'').replace(/lakh|लाख|हजार|thousand|crore|रुपये|rupees/gi,'').trim();document.getElementById('name').value=cleaned.split(/कडून|ला|ला|from|to/i)[0].trim();document.getElementById('form').classList.add('open')}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(s){return s.replace(/'/g,"\\'")}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));render();
</script></body></html>
